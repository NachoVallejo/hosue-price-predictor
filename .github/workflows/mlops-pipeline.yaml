name: MLOps CI Pipeline
on:
  workflow_dispatch:
    inputs:
      run-all:
        description: 'Run all steps of the MLOps pipeline'
        required: false 
        default: true
      run-data-preprocessing:
        description: 'Run data preprocessing step'
        required: false
        default: false
      run-model-training:
        description: 'Run model training step'
        required: false
        default: false
      run-build-and-publish-docker-image:
        description: 'Run Docker image build step'
        required: false
        default: false
  release:
    types: [published]
    branches:
      - main
    tags:
      - 'v*.*.*'
jobs:
  data-preprocessing:
    if: github.event.inputs.run-all == 'true' || github.event.inputs.run-data-preprocessing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Preprocessing
        run: |
          python src/data/run_processing.py --input data/raw/house_data.csv \
          --output data/processed/cleaned_house_data.csv
      - name: Run feature engineering 
        run: |
          python src/features/engineer.py --input data/processed/cleaned_house_data.csv \
          --output data/processed/featured_house_data.csv \
          --preprocessor models/trained/preprocessor.pkl
      - name: Upload preprocessed data artifact
          uses: actions/upload-artifact@v3
          with:
            name: processed-data
            paths: data/processed/featured_house_data.csv
      - name: Upload preprocessor artifact
          uses: actions/upload-artifact@v3
          with:
            name: preprocessor
            paths: models/trained/preprocessor.pkl
  model-training:
    if: github.event.inputs.run-all == 'true' || github.event.inputs.run-model-training == 'true'
    needs: data-preprocessing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download preprocessed data artifact
        uses: actions/download-artifact@v3
        with:
          name: processed-data
          path: data/processed/
      - name: MLflow Tracking Server Setup
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5555:5000 --name mlflow-tracking-server ghcr.io/mlflow/mlflow:latest \
          mlflow server --host 0.0.0.0 \
          --backend-store-uri sqlite:///mlflow.db \
          --default-artifact-root /tmp/mlruns
      - name: Wait for MLflow to Start
        run: |
          for i in {{1..10}}; do curl -f http://localhost:5555/health || sleep 5; done
      - name: Run Model Training
        run: |
          python src/models/train_model.py --config configs/model_config.yaml \
          --data data/processed/featured_house_data.csv \
          --models-dir models \
          --mlflow-tracking-uri http://localhost:5555
      - name: Cleaning up MLflow Tracking Server
        run: |
          docker stop mlflow-tracking-server
          docker rm mlflow-tracking-server
          docker rmi ghcr.io/mlflow/mlflow:latest
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          paths: models/trained/
  build-and-publish-docker-image:
    if: github.event.inputs.run-all == 'true' || github.event.inputs.run-build-and-publish-docker-image == 'true'
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Download trained model artifact
        uses: actions/download-artifact@v3
        with:
          name: trained-model
          path: models/trained/
      - name: Download preprocessor artifact
        uses: actions/download-artifact@v3
        with:
          name: models
          path: models/trained/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: dockerhernan19/app:${{ github.sha }}
          context: .
          file: Dockerfile
      